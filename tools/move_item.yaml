identity:
  author: csersoft
  name: move_item
  label:
    en_US: Move or Rename Item
    zh_Hans: 移动或重命名
description:
  human:
    en_US: Move or rename a file or directory on WebDAV via the MOVE method.
    zh_Hans: 通过 WebDAV MOVE 方法在远端移动或重命名文件与目录。
  llm: Move or rename a file or directory from source_path to destination_path on the WebDAV server.
parameters:
  - name: source_path
    type: string
    required: true
    label:
      en_US: Source Relative Path
      zh_Hans: 源相对路径
    human_description:
      en_US: Existing relative path of the file or directory to move or rename.
      zh_Hans: 要移动或重命名的源文件或目录相对路径。
    llm_description: Relative source path of the file or directory to move.
    form: llm
  - name: destination_path
    type: string
    required: true
    label:
      en_US: Destination Relative Path
      zh_Hans: 目标相对路径
    human_description:
      en_US: New relative path (including target file or folder name).
      zh_Hans: 移动或重命名后的新相对路径（需包含目标文件或目录名）。
    llm_description: Relative destination path (including the target name).
    form: llm
  - name: overwrite
    type: boolean
    required: false
    default: false
    label:
      en_US: Overwrite Destination
      zh_Hans: 覆盖目标同名项
    human_description:
      en_US: Allow replacing an existing resource at the destination path.
      zh_Hans: 开启后允许覆盖目标路径上已存在的同名文件或目录。
    llm_description: Allow overwriting an existing item at destination_path.
    form: form
  - name: create_parents
    type: boolean
    required: false
    default: true
    label:
      en_US: Auto-Create Destination Parents
      zh_Hans: 自动创建目标父目录
    human_description:
      en_US: Automatically create missing parent directories of Destination Relative Path.
      zh_Hans: 若目标路径的上级父目录不存在，自动递归创建。
    llm_description: Automatically create missing parent directories for destination_path.
    form: form
output_schema:
  type: object
  properties:
    source_path:
      type: string
      description: Normalized relative source path
    destination_path:
      type: string
      description: Normalized relative destination path
    type:
      type: string
      description: Moved resource type ('file' or 'directory')
    overwritten:
      type: boolean
      description: Whether an existing destination resource was overwritten
    created_parents:
      type: boolean
      description: Whether missing destination parent directories were created
extra:
  python:
    source: tools/move_item.py
